name: Maker Night seats from Grist

# The Maker Night page counts seats down from src/_data/makerNightSeats.json, and since 2026-11-07 that
# count follows Grist (Jamie: "make the Maker Night seat count follow Grist"). Every 15 minutes this reads
# the Golden Ticket's count from the order service (GET /api/seats, the same Left the order form sells
# against) with scripts/maker-night-seats.mjs. When it has changed, it commits the file to main and starts
# the deploy itself, because a push made with GITHUB_TOKEN starts no other workflow. Run it by hand to
# sync now. A sale on a paper sheet counts once the sheet is entered in Grist.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: maker-night-seats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read the count from Grist
        id: seats
        run: node scripts/maker-night-seats.mjs
      - name: Commit and push
        id: push
        if: steps.seats.outputs.changed == 'true'
        run: |
          left=$(node -p 'const s = require("./src/_data/makerNightSeats.json"); s.total - s.sold')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Maker Night: ${left} seats left, from Grist"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy
        if: steps.seats.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "${{ github.repository }}"
