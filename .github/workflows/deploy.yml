name: Build and deploy to S3 and CloudFront

# Tests and builds the site on every pull request and push; a push to main publishes the build to S3
# behind CloudFront (infra/, scripts/deploy-aws.mjs). GitHub Pages served the site until the DNS moved
# to CloudFront on 2026-10-27.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, cancelling an older one. A deploy in flight is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 7

  # Publishes the tested build: the files that changed, the cache cleared, then the result read back
  # through the distribution.
  deploy-aws:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: aws
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: site
          path: _site

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3 and CloudFront
        run: npm run deploy:aws
